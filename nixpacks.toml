# Used only when Railway builder is NIXPACKS (not RAILPACK).
# RAILPACK reads railpack.json; Dockerfile is an explicit fallback.
[start]
cmd = "node server.mjs"

[variables]
NIXPACKS_NODE_VERSION = "20"
YFINANCE_PYTHON = "python3"

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "python3 -m pip install --user yfinance || python3 -m pip install yfinance",
]
